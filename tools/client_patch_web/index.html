<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户端地址修改</title>
<style>
:root{--blue:#2563eb;--text:#1f2937;--muted:#6b7280;--line:#d1d5db;--bg:#f5f7fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}.page{max-width:720px;margin:0 auto;padding:32px 20px 48px}.header{margin-bottom:24px}.header h1{font-size:30px;margin:0 0 8px}.header p{color:var(--muted);margin:0}.notice{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px 14px;margin:18px 0;color:#1e40af;font-size:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;box-shadow:0 4px 16px rgba(15,23,42,.05)}.step{display:flex;gap:12px;padding:18px 0;border-top:1px solid #eef0f3}.step:first-of-type{border-top:0;padding-top:0}.num{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:#e5edff;color:var(--blue);display:grid;place-items:center;font-weight:700}.step h2{font-size:18px;margin:0 0 4px}.help{color:var(--muted);font-size:14px;margin:0 0 12px}.drop{border:1px dashed #9ca3af;border-radius:8px;padding:22px;text-align:center;cursor:pointer;background:#fafafa}.drop:hover,.drop.drag{border-color:var(--blue);background:#f8fbff}.drop strong{display:block}.hint{display:block;color:var(--muted);font-size:13px;margin-top:3px}.fields{display:grid;gap:12px}label{display:grid;gap:5px;font-weight:600;font-size:14px}input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:7px;font:14px ui-monospace,SFMono-Regular,Consolas,monospace}input:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}.button{width:100%;margin-top:18px;border:0;border-radius:7px;padding:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;cursor:pointer}.button:disabled{opacity:.45;cursor:not-allowed}.bar{height:7px;background:#eef2f7;border-radius:8px;overflow:hidden;margin-top:16px;display:none}.bar>i{display:block;height:100%;width:0;background:var(--blue)}.status{margin-top:12px;color:var(--muted);white-space:pre-wrap}.ok{color:#047857}.bad{color:#b91c1c}.result{display:none;margin-top:16px;padding:14px;border:1px solid #dbeafe;border-radius:8px;background:#f8fbff}.result a{color:#1d4ed8;font-weight:700}.meta{font-size:13px;color:var(--muted);margin-top:7px}.result details{margin-top:10px}.result summary{color:#1d4ed8;cursor:pointer}pre{overflow:auto;max-height:300px;background:#f8fafc;padding:10px;font-size:12px}.footer{color:var(--muted);font-size:13px;margin-top:14px}@media(max-width:600px){.page{padding:22px 14px 36px}.card{padding:18px}.header h1{font-size:26px}}
</style></head>
<body><main class="page"><header class="header"><h1>修改客户端地址</h1><p>按下面 3 步操作，就可以生成一个连接到新服务器的客户端文件。</p></header>
<div class="notice">文件只在你的浏览器里处理，不会上传。处理完成后，下载的文件还需要重新签名才能安装。</div>
<section class="card"><div class="step"><span class="num">1</span><div><h2>选择客户端文件</h2><p class="help">选择你手里的 APK 或 IPA 文件。</p><div id="drop" class="drop"><strong id="fileName">点击这里选择文件，或把文件拖进来</strong><span class="hint">支持 .apk 和 .ipa，文件大小不超过 4 GiB</span></div><input id="file" type="file" accept=".apk,.ipa" hidden></div></div>
<div class="step"><span class="num">2</span><div style="width:100%"><h2>填写服务器地址</h2><p class="help">如果你不确定怎么填，请直接使用管理员给你的地址。</p><div class="fields"><label>接口地址<input id="apiOrigin" value="" placeholder="请填写 HTTPS 接口地址" spellcheck="false"></label><label>资源地址<input id="assetOrigin" value="" placeholder="请填写 HTTPS 资源地址" spellcheck="false"></label></div></div></div>
<div class="step"><span class="num">3</span><div style="width:100%"><h2>生成新文件</h2><p class="help">点击按钮后等待完成，再下载结果。</p><button id="submit" class="button" disabled>生成新的客户端文件</button><div id="bar" class="bar"><i></i></div><div id="status" class="status"></div><div id="result" class="result"></div></div></div></section>
<p class="footer">支持 Chrome、Edge、Firefox 和 Safari 的较新版本。输出文件未签名，安装前请重新签名。</p><noscript>需要启用 JavaScript 才能完成处理。</noscript></main><script type="module" src="app.js"></script></body></html>
