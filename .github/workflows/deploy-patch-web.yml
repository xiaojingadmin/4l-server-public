name: Deploy APK IPA patcher

on:
  push:
    branches: [main]
    paths:
      - 'tools/client_patch_web/**'
      - '.github/workflows/deploy-patch-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload patcher
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools/client_patch_web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
